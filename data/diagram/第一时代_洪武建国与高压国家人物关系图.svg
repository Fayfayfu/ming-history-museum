<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 1700" role="img" aria-labelledby="title desc">
<title id="title">第一时代：洪武建国与高压国家人物关系图</title>
<desc id="desc">展示1368至1398年洪武建国、制度重建、皇储宗藩、统一战争与功臣清洗中的19位人物关系。</desc>
